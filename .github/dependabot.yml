# Weekly update pull requests for npm packages and GitHub Actions. The cooldown waits a week after a
# release before suggesting it, so a bad or hijacked version has time to be caught, matching the
# minimum release age in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Small updates come together, one pull request for each kind
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
