# Every check that runs locally, on every push to main and every pull request. The deploy workflow
# runs it too, so nothing is published without passing. Actions are pinned to full commit SHAs, so
# a moved tag can't change what runs; Dependabot keeps them up to date.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow name keeps a deploy's own test run apart from a push's
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Corepack installs the exact pnpm in package.json, checking its hash
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      # CI is set, so Playwright runs Chromium only, retries once, and writes an HTML report
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
